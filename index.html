<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Medo · I did it myself</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Medo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1f3b; --bg2:#262b52; --ink:#fff; --muted:#aab0e0;
    --k0:#ff9f43; --k0d:#a85d14; --k1:#2ecc9a; --k1d:#167a5b;
    --good:#2ecc71; --warn:#f6c343; --bad:#ff5e5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 20% 0%,#2f3670 0%,var(--bg) 60%);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;padding:10px 14px 14px;gap:10px}
  header{display:flex;align-items:center;gap:12px;position:relative;min-height:56px;--hb:clamp(48px,5.2vw,56px)}
  .brand{background:none;border:none;padding:0;cursor:pointer;flex:none;line-height:0}
  .brand svg{height:clamp(42px,5.4vw,60px);width:auto;display:block}
  .brand.wiggle svg{animation:wiggle .7s ease-in-out}
  @keyframes wiggle{20%{transform:rotate(-8deg) scale(1.08)}45%{transform:rotate(7deg) scale(1.12)}70%{transform:rotate(-4deg) scale(1.05)}100%{transform:none}}
  header.centred .countdown{visibility:hidden}
  header.centred .dt{position:absolute;left:50%;transform:translateX(-50%);text-align:center;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
  .day{font-size:clamp(20px,3.2vw,34px);font-weight:800;line-height:1}
  header:not(.centred) .dt{display:flex;flex-direction:column;justify-content:center;gap:2px;flex:none;line-height:1}
  @media (max-width:640px){header:not(.centred){flex-wrap:wrap;row-gap:10px}header:not(.centred) .countdown{order:5;flex:1 1 100%}header:not(.centred) .dt{flex:1}}
  .trippill{background:var(--accent,#ffd23f);color:#1b1f3b;border:none;border-radius:99px;padding:4px 12px;font-family:inherit;font-weight:800;font-size:clamp(14px,1.8vw,18px);cursor:pointer;white-space:nowrap;align-self:center}
  .clock{font-size:clamp(16px,2.4vw,26px);color:var(--muted);font-weight:700}
  .countdown{flex:1;display:flex;align-items:center;min-width:0}
  .cd-label{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:0 6px;font-size:clamp(14px,1.8vw,19px);font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;pointer-events:none}
  .cd-label span{overflow:hidden;text-overflow:ellipsis}
  .cd-label.big{left:0!important;right:clamp(44px,5.4vw,60px)!important}
  .cd-label.big{font-size:clamp(18px,2.6vw,28px);color:#1b1f3b;text-shadow:none}
  .mover,.car{z-index:2}
  .road{position:relative;flex:1;height:var(--hb);border-radius:99px;background:#0e1130;overflow:visible}
  .road.go .road-fill{background:#ffd23f}
  .road.go{animation:goPulse 1.2s ease-in-out infinite}
  @keyframes goPulse{50%{box-shadow:0 0 0 5px rgba(255,210,63,.55)}}
  .road-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#3b4a9e,#7d6bff);transition:width 1s linear}
  .mover{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(28px,4vw,44px);line-height:1;transition:left 1s linear}
  .car{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:clamp(30px,4.2vw,46px);line-height:1}
  .cd-fill{height:100%;width:100%;border-radius:99px;background:var(--good);transition:width 1s linear,background .5s}
  .iconbtn{width:var(--hb,52px);height:var(--hb,52px);border-radius:16px;border:none;background:#2a3060;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;color:#fff;font-size:26px;position:relative;flex:none;cursor:pointer}
  .iconbtn svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
  .iconbtn svg.ring circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:151;stroke-dashoffset:151}
  .iconbtn.holding svg.ring circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
  main{flex:1;display:flex;gap:14px;min-height:0}
  .lane{flex:1;display:flex;flex-direction:column;background:var(--bg2);border-radius:24px;padding:12px;gap:10px;min-width:0;border:4px solid transparent;position:relative;overflow:hidden}
  .lane.k0{--c:var(--k0);--cd:var(--k0d)} .lane.k1{--c:var(--k1);--cd:var(--k1d)}
  .lane.complete{border-color:var(--c);box-shadow:0 0 30px var(--c)}
  .lane-head{display:flex;align-items:center;gap:10px}
  .avatar{font-size:clamp(36px,5.5vw,60px);line-height:1;transition:transform .3s}
  .lane.complete .avatar{animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(-8deg)}}
  .name{font-size:clamp(22px,3.4vw,38px);font-weight:800;line-height:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .streak{font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px;white-space:nowrap}
  .prog{height:18px;border-radius:99px;background:#0e1130;overflow:hidden}
  .prog-fill{height:100%;background:var(--c);border-radius:99px;transition:width .4s cubic-bezier(.3,1.6,.6,1)}
  .tiles{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,13vw,150px),1fr));grid-auto-rows:minmax(90px,1fr);gap:10px;overflow-y:auto;align-content:start}
  .tile{border:none;border-radius:20px;background:#363d75;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-family:inherit;position:relative;cursor:pointer;transition:transform .12s,background .2s;box-shadow:0 5px 0 #1a1f45}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 #1a1f45}
  .tile .em{font-size:clamp(34px,5vw,56px);line-height:1.1}
  .tile .lb{font-size:clamp(13px,1.6vw,19px);font-weight:700;line-height:1.1;text-align:center;margin-top:4px}
  .tile.done{background:var(--c);box-shadow:0 5px 0 var(--cd)}
  .tile.done .em{opacity:.35}
  .tile .tick{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(44px,6vw,70px)}
  .tile.done .tick{display:flex;animation:pop .35s cubic-bezier(.3,1.8,.6,1)}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .empty{color:var(--muted);text-align:center;margin:auto;font-size:22px}
  .banner{position:absolute;left:0;right:0;bottom:0;background:var(--c);color:#111;text-align:center;font-weight:800;font-size:clamp(20px,3vw,32px);padding:8px;transform:translateY(100%);transition:transform .4s}
  .lane.complete .banner{transform:none}
  .confetti{position:fixed;top:-60px;font-size:34px;pointer-events:none;z-index:50;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
  @media (orientation:portrait){main{flex-direction:column}}

  /* hold to undo */
  .tile.done{touch-action:none}
  .tile .hold{position:absolute;left:0;bottom:0;height:8px;width:0;background:#fff;border-radius:0 0 20px 20px;opacity:.9}
  .tile.holding .hold{width:100%;transition:width 1.5s linear}
  .tile.hinted::after{content:'Hold to undo';position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#0e1130;color:#fff;font-size:13px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;z-index:2}

  /* one at a time (Now & Next) */
  .nn{flex:1;display:flex;gap:16px;min-height:0;align-items:stretch}
  .tile.nn-now{flex:2.2;border-radius:30px;box-shadow:0 8px 0 #1a1f45;animation:nudge 2.4s ease-in-out infinite}
  .lane.solo .tile.nn-now .em{font-size:clamp(90px,15vw,180px)}
  .lane.solo .tile.nn-now .lb{font-size:clamp(26px,3.8vw,46px)}
  @keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .nn-next{flex:1;background:#0e1130;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.75;padding:8px}
  .nn-next .nn-cap{font-size:clamp(18px,2.6vw,30px);font-weight:800;color:var(--muted)}
  .nn-next .em{font-size:clamp(54px,8vw,96px);line-height:1.1}
  .nn-next .lb{font-size:clamp(15px,2vw,22px);font-weight:700;text-align:center}
  .nn-done{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(100px,18vw,200px)}
  .nn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tile.mini{width:clamp(54px,7vw,76px);height:clamp(54px,7vw,76px);border-radius:16px;box-shadow:0 4px 0 #1a1f45;padding:0}
  .lane.solo .tile.mini .em{font-size:clamp(26px,3.6vw,40px)}
  .lane.solo .tile.mini .tick{font-size:clamp(26px,3.6vw,40px)}
  .tile.mini.hinted::after{font-size:11px;top:-22px}

  /* badges, many kids, milestone banner */
  .kbadges{position:absolute;top:12px;right:14px;display:flex;gap:6px}
  .lbadges{display:flex;gap:6px;flex:none}
  .pill{font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px;white-space:nowrap}
  main.many{flex-wrap:wrap}
  main.many .kcard{flex:1 1 40%}
  main.many .ring{width:clamp(80px,12vw,140px)}
  main.many .ring-inner{font-size:clamp(40px,6vw,74px)}
  .mile{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,40,.82);pointer-events:none;animation:mileIn .5s cubic-bezier(.3,1.6,.6,1);transition:opacity .6s}
  .mile.out{opacity:0}
  .mile-big{font-size:clamp(90px,16vw,200px);font-weight:800;line-height:1;text-shadow:0 0 40px #ffd23f}
  .mile-small{font-size:clamp(24px,3.6vw,44px);font-weight:800;margin-top:12px;text-align:center;padding:0 20px}
  @keyframes mileIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* upcoming events strip */
  .events{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding:6px 0 4px}
  .evchip{display:flex;align-items:center;gap:14px;background:var(--bg2);border:3px solid #444b8a;border-radius:20px;padding:10px 22px 10px 14px;color:#fff;font-family:inherit;cursor:pointer;min-width:170px}
  .evchip.today{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.5)}
  .evemo{font-size:clamp(28px,3.6vw,40px);line-height:1}
  .evtxt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
  .evname{font-size:clamp(13px,1.6vw,17px);font-weight:700;color:var(--muted)}
  .evdays{font-size:clamp(18px,2.4vw,26px);font-weight:800}

  /* morning / afternoon tabs */
  .ptabs{display:flex;gap:10px;justify-content:center}
  .ptab{font-family:inherit;font-weight:800;font-size:clamp(14px,1.8vw,20px);padding:4px 18px;border-radius:99px;border:none;background:var(--bg2);color:var(--muted);cursor:pointer}
  .ptab.sel{background:#fff;color:#1b1f3b}

  /* home cards */
  .kcard{flex:1;min-width:0;border:5px solid var(--c);border-radius:30px;background:var(--bg2);color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;box-shadow:0 8px 0 var(--cd);transition:transform .12s;padding:12px}
  .kcard:active{transform:translateY(4px);box-shadow:0 4px 0 var(--cd)}
  .kcard.k0{--c:var(--k0);--cd:var(--k0d)} .kcard.k1{--c:var(--k1);--cd:var(--k1d)}
  .kcard.complete{box-shadow:0 0 34px var(--c),0 8px 0 var(--cd)}
  .ring{width:clamp(120px,20vw,230px);aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .4s}
  .ring-inner{width:80%;height:80%;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:clamp(60px,10vw,120px);line-height:1}
  .kcard.complete .ring-inner{animation:bounce 1s infinite}
  .kname{font-size:clamp(28px,4.6vw,54px);font-weight:800;line-height:1}
  .kcount{font-size:clamp(16px,2.2vw,24px);color:var(--muted);font-weight:700}
  .knext{background:#0e1130;border-radius:16px;padding:6px 18px;font-size:clamp(18px,2.8vw,32px);font-weight:800;text-align:center}
  .kstreak{position:absolute;top:12px;right:14px;font-size:clamp(16px,2.2vw,24px);font-weight:800;background:#0e1130;padding:4px 12px;border-radius:99px}
  /* one kid's page */
  .homebtn{width:clamp(54px,7vw,72px);height:clamp(54px,7vw,72px);border-radius:18px;border:none;background:#0e1130;color:#fff;font-size:clamp(28px,4vw,40px);cursor:pointer;flex:none}
  .ochip{border-radius:14px;padding:4px 12px;font-size:clamp(22px,3.2vw,36px);flex:none;white-space:nowrap}
  .lane.solo .tiles{grid-template-columns:repeat(auto-fill,minmax(clamp(130px,18vw,220px),1fr));grid-auto-rows:minmax(120px,1fr);gap:14px}
  .lane.solo .tile .em{font-size:clamp(48px,7vw,80px)}
  .lane.solo .tile .lb{font-size:clamp(16px,2.1vw,24px)}
  .lane.solo .prog{height:24px}

  /* weather */
  .wx{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:20px;padding:8px 14px;border:4px solid var(--wc,#444b8a);cursor:pointer}
  .wx-badge{display:flex;align-items:center;gap:6px;background:var(--wc,#444b8a);color:#111;border-radius:16px;padding:4px 14px;font-weight:800;font-size:clamp(24px,3.6vw,40px);flex:none}
  .wx-text{flex:none;min-width:0;max-width:30%}
  .wx-title{font-size:clamp(18px,2.6vw,30px);font-weight:800;line-height:1.05;color:var(--wc,#fff)}
  .wx-sub{font-size:clamp(11px,1.3vw,14px);color:var(--muted);font-weight:600;margin-top:2px}
  .wx-wear{flex:1;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .wear{display:flex;flex-direction:column;align-items:center;background:#0e1130;border-radius:16px;padding:6px 12px;min-width:84px}
  .wear .e{font-size:clamp(40px,6vw,64px);line-height:1.1}
  .wear .t{font-size:clamp(12px,1.5vw,17px);font-weight:700;color:#fff}
  .wx.off{opacity:.6}

  /* UV */
  .uv{display:flex;align-items:center;gap:14px;background:var(--bg2);border-radius:20px;padding:8px 14px;border:4px solid var(--uc,#444b8a);cursor:pointer}
  .uv-light{width:clamp(40px,5.5vw,62px);height:clamp(40px,5.5vw,62px);border-radius:50%;background:var(--uc,#444b8a);box-shadow:0 0 22px var(--uc,transparent);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(18px,2.6vw,28px);color:#111}
  .uv-text{flex:1;min-width:0}
  .uv-title{font-size:clamp(18px,2.6vw,30px);font-weight:800;line-height:1.05;color:var(--uc,#fff)}
  .uv-sub{font-size:clamp(13px,1.7vw,19px);color:var(--muted);font-weight:700}
  .uv-strip{display:flex;gap:3px;align-items:flex-end;flex:none}
  .uvh{display:flex;flex-direction:column;align-items:center;gap:2px}
  .uvh .b{width:clamp(16px,2.2vw,28px);height:clamp(22px,3vw,34px);border-radius:6px}
  .uvh .l{font-size:clamp(10px,1.2vw,13px);color:var(--muted);font-weight:700}
  .uvh.now .b{outline:3px solid #fff;outline-offset:1px}
  .uv.off{opacity:.6}

  /* ===== settings layout ===== */
  .s-saved{color:var(--muted);font-size:15px;font-weight:600}
  #settings input[type=number],#settings input[type=date]{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #444b8a;background:#0e1130;color:#fff;color-scheme:dark}
  #settings input[type=text]{color-scheme:dark}
  .s-wrap>*{min-width:0}
  .bigname{width:100%}
  .s-wrap{flex:1;display:flex;min-height:0}
  .s-nav{width:210px;flex:none;background:#171b45;padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
  .s-nav button{display:flex;align-items:center;gap:12px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:18px;font-weight:700;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:left;white-space:nowrap}
  .s-nav button .ni{font-size:22px}
  .s-nav button.sel{background:#2f3670;color:#fff}
  .s-body{flex:1;overflow-y:auto;padding:20px 22px 40px;display:block}
  .s-inner{max-width:860px;width:100%;min-width:0;margin:0 auto}
  .stitle{margin:0 0 16px;font-size:28px}
  .ssub{color:var(--muted);font-size:16px;margin:0 0 16px}
  .scard{background:var(--bg2);border-radius:18px;padding:16px 18px;margin-bottom:14px}
  .scard>h3{margin:0 0 2px;font-size:20px;color:#fff}
  .scard>.desc{color:var(--muted);font-size:15px;margin:0 0 8px}
  .field{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
  .scard>.field:first-child,.scard>h3+.field,.scard>.desc+.field,.body>.field:first-child{border-top:none}
  .fl{flex:1;min-width:0}.fl b{display:block;font-size:17px}.fl span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
  .fc{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
  .muted{color:var(--muted);font-size:16px}
  .status{background:#0e1130;border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0 0}
  .switch{position:relative;display:inline-block;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .tr{display:block;width:54px;height:32px;border-radius:99px;background:#444b8a;transition:background .2s;position:relative}
  .switch .tr::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
  .switch input:checked+.tr{background:var(--good)}
  .switch input:checked+.tr::after{left:26px}
  .seg{display:inline-flex;flex-wrap:wrap;background:#0e1130;border-radius:12px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:16px;padding:8px 13px;border-radius:9px;cursor:pointer}
  .seg button.sel{background:#fff;color:#1b1f3b}
  .linkbtn{background:none;border:none;color:#ff8a8a;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:6px}
  .kidtop{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .avbtn{font-size:46px;line-height:1;background:#0e1130;border:2px dashed #444b8a;border-radius:18px;width:78px;height:78px;cursor:pointer;flex:none}
  .bigname{flex:1;min-width:0;font-size:24px !important;font-weight:800;padding:10px 12px !important}
  .avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:#0e1130;border-radius:14px;padding:8px;margin:8px 0}
  .avgrid button{font-size:30px;background:transparent;border:2px solid transparent;border-radius:12px;padding:4px;cursor:pointer}
  .avgrid button.sel{border-color:var(--warn)}
  .addcard{width:100%;padding:18px;border-radius:18px;border:2px dashed #444b8a;background:transparent;color:#fff;font-family:inherit;font-size:19px;font-weight:800;cursor:pointer;margin-bottom:8px}
  .qwrap{overflow-x:auto;margin-top:10px}
  .qtable{width:100%;border-collapse:collapse}
  .qtable th{padding:6px 4px;text-align:center;font-weight:700;vertical-align:bottom}
  .qtable td{padding:4px;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
  .qtable td.ql,.qtable th.ql{text-align:left;width:100%}
  .qtable td.ql{display:flex;align-items:center;gap:10px;font-size:17px;padding:8px 4px}

  // A quest tile. Tap to tick. Ticked tiles need a 1.5s hold to undo, so little fingers can't untick by accident.
  function makeTile(k,s,isDone,extra){
    var b=el('button',{'class':'tile'+(isDone?' done':'')+(extra?' '+extra:'')});
    b.appendChild(iconEl(s.emoji,'em'));
    if(extra!=='mini')b.appendChild(el('div',{'class':'lb'},s.label));
    b.appendChild(el('div',{'class':'tick'},'✅'));
    b.appendChild(el('div',{'class':'hold'}));
    if(s.proof&&!isDone)b.appendChild(el('div',{'class':'pfbadge',title:s.proof==='photo'?'Needs a photo':'Show a grown-up'},s.proof==='photo'?'📸':'🙋'));
    if(!isDone){b.addEventListener('click',function(){toggle(k,s);});return b;}
    var t=null;
    b.addEventListener('pointerdown',function(e){
      try{b.setPointerCapture(e.pointerId);}catch(_){}
      b.classList.add('holding');
      t=setTimeout(function(){t=null;b.classList.remove('holding');toggle(k,s);},1500);
    });
    b.addEventListener('pointerup',function(){
      if(t){clearTimeout(t);t=null;b.classList.remove('holding');
        b.classList.add('hinted');setTimeout(function(){b.classList.remove('hinted');},1600);}
    });
    b.addEventListener('pointercancel',function(){if(t){clearTimeout(t);t=null;b.classList.remove('holding');}});
    b.addEventListener('contextmenu',function(e){e.preventDefault();});
    return b;
  }

  function allDoneToday(k){
    var any=false;
    for(var pi=0;pi<2;pi++){var st=todaysSteps(k,['am','pm'][pi]);if(st.length)any=true;

  function toggle(k,s,proofType){ // proofType: 'photo' | 'parent' once the proof screen has been passed
    keepAwake();bumpIdle();
    var kd=cfg.kids[k],done=prog.done[k],i=done.indexOf(s.id),t=today();
    if(i<0&&s.proof&&!proofType){openProof(k,s);return;}
    var rwBefore=earnedRewardIds(k);
    if(i>-1){
      done.splice(i,1);undoSound();
      if(prog.proof[k]&&prog.proof[k][s.id]){if(prog.proof[k][s.id]==='photo')photoDel(photoKey(t,kidId(k),s.id));delete prog.proof[k][s.id];}
      // undo today's reading day and star if they were just earned
      if(s.id==='reading'&&kd.reads.last===t){kd.reads.count=Math.max(0,kd.reads.count-1);kd.reads.last=kd.reads.prev||'';}
      if(kd.stars.last===t&&!allDoneToday(k)){kd.stars.count=Math.max(0,kd.stars.count-1);kd.stars.last=kd.stars.prev||'';}
      save('qb_cfg',cfg);
    }
    else{
      done.push(s.id);
      if(proofType)prog.proof[k][s.id]=proofType;
      stats('quest-ticked',proofType?'with '+proofType+' proof':'');
      var per=curPeriod(),lines=[],big=false,milestone=0;
      var steps=todaysSteps(k,per);
      var left=steps.filter(function(x){return done.indexOf(x.id)<0;}).length;
      // reading count
      if(s.id==='reading'&&kd.reads.last!==t){
        kd.reads.prev=kd.reads.last;kd.reads.last=t;kd.reads.count=(kd.reads.count||0)+1;
        var rc=kd.reads.count;
        if(rc%50===0){milestone=rc;lines.push(pastPhrase(s)+'! Wow! '+kd.name+', that is '+rc+' days of reading! That is amazing!');}
        else lines.push(pastPhrase(s)+'! That is '+rc+(rc===1?' day':' days')+' of reading. Great job!');
      }
      else if(left>0){lines.push(praiseLine(s));}
      else lines.push(pastPhrase(s)+'!');
      if(left===0){
        big=true;
        lines.push('Hooray '+kd.name+'! All done'+(per==='pm'?' for the afternoon':' for the morning')+'!');
        prog.celebrated[per][k]=true;
      }
      // star jar: everything done for the whole day
      var star=false;
      if(allDoneToday(k)&&kd.stars.last!==t){
        kd.stars.prev=kd.stars.last;kd.stars.last=t;kd.stars.count=(kd.stars.count||0)+1;star=true;stats('full-day','Every quest done');
        lines.push('You did it all by yourself, '+kd.name+'!');
        lines.push('You earned a star for your star jar! You have '+kd.stars.count+(kd.stars.count===1?' star!':' stars!'));
      }
      save('qb_cfg',cfg);
      recordToday();
      var newRw=rewardsFor(k).filter(function(x){return x.p.earned&&rwBefore.indexOf(x.rw.id)<0;})[0];
      if(newRw)lines.push(newRw.rw.kind==='money'?'And you earned '+moneySay(newRw.rw.amount)+' for your money jar! Tell a grown-up!':'And you earned a reward: '+newRw.rw.prize+'! Tell a grown-up!');
      var newB=trophOn()?updTrophies(k).news:[];
      if(newB.length)lines.push('You won a new badge: '+newsTitle(newB[0])+'!'+(newB.length>1?' And '+(newB.length-1)+' more!':'')+' Look in your trophy case.');
      if(newRw&&!milestone){bigFanfare();confetti(k,['🎁','🎉','⭐','🏆','✨']);showBanner(newRw.rw.kind==='money'?'💰':(newRw.rw.emoji||'🎁'),kd.name+' earned: '+rwPrize(newRw.rw)+'!');}
      else if(milestone){bigFanfare();confetti(k,['📚','🏆','⭐','🎉','✨']);showBanner('📚 '+milestone+'!',kd.name+' — '+milestone+' days of reading!');}
      else if(newB.length){badgeSound();var nb=newB[0];
        confetti(k,['🏆','🏅','✨','⭐','🎖️']);
        showBanner(nb.month?medalEl(monthEm(+nb.month.slice(5,7)-1),'m'):medalEl(nb.b.em,nb.b.secret?0:nb.t,nb.b.secret?'secretwon':''),kd.name+' won: '+newsTitle(nb)+'!');}
      else if(star){fanfare();confetti(k,['⭐','🌟','✨','⭐']);showBanner('⭐','I did it myself! ⭐ '+kd.stars.count+' in '+kd.name+'\'s jar');}
      else if(big){fanfare();confetti(k);}
      else blip();
      if(!tipSeen('undo:'+kidId(k))){markTip('undo:'+kidId(k));lines.push('Oops, wrong one? Hold your finger on it to undo.');}
      var vm=msgAfterTick(k,left===0?per:'',star,s.id);

      if(big&&!isSplit()){clearTimeout(idleT);idleT=setTimeout(goHome,milestone||star?8000:6000);}
    }
    save('qb_prog',prog);
    render();
  }

  // ---------- departures: the regular leave time plus events that need leaving for ----------
  function departuresToday(){
    var out=[],t=today0(),pl=todayPlan();
    if(pl.leave)out.push({leave:pl.leave,dest:cfg.leave.dest,name:''});
    (cfg.events||[]).forEach(function(ev){if(ev.leave&&occursOn(ev,t))out.push({leave:ev.leave,dest:ev.emoji||'🚗',name:ev.name||''});});
    out.sort(function(a,b){return a.leave<b.leave?-1:1;});
    return out;
  }
  function nextDeparture(){   // the one the runner should count down to right now
    var now=new Date(),list=departuresToday();
    for(var i=0;i<list.length;i++){
      var p=list[i].leave.split(':'),lt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+p[0],+p[1]);
      var mins=Math.ceil((lt-now)/60000),later=i<list.length-1;
      if(mins>(later?-15:-90))return {leave:list[i].leave,dest:list[i].dest,name:list[i].name,h:+p[0],m:+p[1],mins:mins};
    }
    return null;
  }

  function renderHeader(){

    function setRoad(pct){ // 0 = start of the road, 100 = at the car
      road.style.display='';
      fill.style.width=pct+'%';
      mover.style.left='calc('+pct+'% * 0.86)';
      // keep the words clear of the runner: in the empty part of the road early on, inside the filled part later
      var rp=(pct*0.86).toFixed(1);
      if(pct<50){lbl.style.left='calc('+rp+'% + clamp(40px,5vw,54px))';lbl.style.right='clamp(44px,5.4vw,60px)';}
      else{lbl.style.left='8px';lbl.style.right='calc('+(100-rp)+'% + 4px)';}
      var fig=cfg.runner.fig==='kids'?cfg.kids.map(function(x){return x.emoji;}).join(''):cfg.runner.fig;
      if(mover.textContent!==fig)mover.textContent=fig;

    }
    var hdr=document.querySelector('header');
    lbl.classList.remove('big');hdr.classList.remove('centred');road.classList.remove('go');
    function setLbl(t){if(lbl.textContent!==t){lbl.innerHTML='';lbl.appendChild(el('span',null,t));}}
    if(!leave){hdr.classList.add('centred');return;}
    var parts=leave.split(':');
    var lt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+parts[0],+parts[1]);
    var mins=Math.ceil((lt-now)/60000);
    var window_=cfg.leave.window||60; // the runner travels to the destination over this many minutes
    var destEl=document.getElementById('dest');if(destEl.textContent!==D.dest)destEl.textContent=D.dest;
    if(mins>window_){setRoad(0);setLbl(D.name?'Leave for '+D.name+' at '+fmt(leave):'Leave at '+fmt(leave));}
    else if(mins>0){setRoad((window_-mins)/window_*100);setLbl((D.name?D.name+' · '+fmt(leave):'Leave '+fmt(leave))+' · '+(mins>=60?Math.floor(mins/60)+' h '+(mins%60)+' min':mins+' min'));}
    else if(mins>-90){setRoad(100);lbl.classList.add('big');road.classList.add('go');setLbl('Time to go!');}
    else hdr.classList.add('centred'); // after the morning rush: just the day and time, centred
  }

  // ---------- Updates: the board checks for a new version and refreshes itself when nobody is using it ----------
  var updateReady=null,lastTouch=Date.now();

  function forceRefresh(){
    var jobs=[];
    try{if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}));}catch(e){}
    try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}));}catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){location.replace(location.pathname+'?fresh='+Date.now());});
  }

  // ---------- "What time is it?" clock (tap the countdown or the time) ----------
  var NUMW=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
  function hourWord(h){return NUMW[(h%12)||12];}
  function clockPhrase(h,m){ // m is a multiple of 5; "quarter past seven", "twenty to eight"
    var MW={5:'five',10:'ten',20:'twenty',25:'twenty-five'};
    if(m===0)return hourWord(h)+' o\'clock';
    if(m===15)return 'quarter past '+hourWord(h);
    if(m===30)return 'half past '+hourWord(h);
    if(m===45)return 'quarter to '+hourWord(h+1);
    if(m<30)return MW[m]+' past '+hourWord(h);
    return MW[60-m]+' to '+hourWord(h+1);
  }
  function round5(h,m){var t=Math.round((h*60+m)/5)*5;return [Math.floor(t/60)%24,t%60];}
  function durPhrase(mins){
    var h=Math.floor(mins/60),m=mins%60,p=[];
    if(h)p.push(h===1?'one hour':h+' hours');
    if(m)p.push(m===1?'one minute':m+' minutes');
    return p.join(' and ')||'no time';
  }
  function leaveInfo(){var D=nextDeparture();return D?{h:D.h,m:D.m,mins:D.mins,name:D.name,dest:D.dest}:null;}
  function timeSpeechParts(){ // [what time it is now, what happens next]
    var n=new Date(),r=round5(n.getHours(),n.getMinutes()),now='It\'s '+clockPhrase(r[0],r[1])+'.',next='';
    var L=leaveInfo();
    if(L&&L.mins>0&&L.mins<=180){
      var lp=L.m%5===0?clockPhrase(L.h,L.m):(hourWord(L.h)+' '+L.m);
      next='We have to leave'+(L.name?' for '+L.name:'')+' at '+lp+'.';
      if(L.mins<=5)next+=' That\'s in just '+durPhrase(L.mins)+', so it\'s nearly time to go!';
      else next+=' That\'s in '+durPhrase(L.mins)+'.';
    } else if(L&&L.mins<=0&&L.mins>-60)next='It\'s time to go'+(L.name?' to '+L.name:'')+'! Shoes on and '+(L.name?'out the door':destPhrase())+'!';
    return [now,next];
  }
  function timeSpeech(){var p=timeSpeechParts();return (p[0]+' '+p[1]).trim();}
  var CK={C:110,R:100};
  function ckPt(angleDeg,rad){var a=(angleDeg-90)*Math.PI/180;return [CK.C+rad*Math.cos(a),CK.C+rad*Math.sin(a)];}
  function wedgePath(a1,a2){
    if(a2-a1<0.5)return '';
    var r=CK.R-6,p1=ckPt(a1,r),p2=ckPt(a2,r),large=(a2-a1)>180?1:0;
    return 'M110 110 L'+p1[0]+' '+p1[1]+' A'+r+' '+r+' 0 '+large+' 1 '+p2[0]+' '+p2[1]+' Z';
  }
  function handTo(id,angle,len){var e=document.getElementById(id);if(!e)return;var p=ckPt(angle,len);e.setAttribute('x2',p[0]);e.setAttribute('y2',p[1]);}
  function clockSVG(){
    var n=new Date(),hh=n.getHours(),mm=n.getMinutes(),ss=n.getSeconds(),R=CK.R,sv='';
    var col=cfg.leave.wedge||'#ff6b6b';
    sv+='<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">';
    sv+='<circle cx="110" cy="110" r="104" fill="'+(cfg.leave.face||'#ffffff')+'" stroke="#2f3670" stroke-width="8"/>';
    sv+='<path id="ckWedge" d="" fill="'+col+'" opacity=".55"/>';
    for(var i=0;i<60;i++){var o=ckPt(i*6,R-2),q=ckPt(i*6,i%5===0?R-12:R-7);sv+='<line x1="'+o[0]+'" y1="'+o[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="#1b1f3b" stroke-width="'+(i%5===0?3:1.2)+'"/>';}
    for(var k=1;k<=12;k++){var t=ckPt(k*30,R-27);sv+='<text x="'+t[0]+'" y="'+t[1]+'" font-size="20" font-weight="800" font-family="Baloo 2,sans-serif" fill="#1b1f3b" text-anchor="middle" dominant-baseline="central">'+k+'</text>';}
    // "leaving time" ghost hands (hidden until the sweep)
    sv+='<line id="ckGH" x1="110" y1="110" x2="110" y2="110" stroke="'+col+'" stroke-width="9" stroke-linecap="round" opacity="0"/>';
    sv+='<line id="ckGM" x1="110" y1="110" x2="110" y2="110" stroke="'+col+'" stroke-width="6" stroke-linecap="round" opacity="0"/>';
    // real hands: short dark hour hand, long blue minute hand
    var ha=((hh%12)+mm/60)*30,ma=(mm+ss/60)*6,hp=ckPt(ha,52),mp=ckPt(ma,80);
    sv+='<line id="ckH" x1="110" y1="110" x2="'+hp[0]+'" y2="'+hp[1]+'" stroke="#1b1f3b" stroke-width="9" stroke-linecap="round"/>';
    sv+='<line id="ckM" x1="110" y1="110" x2="'+mp[0]+'" y2="'+mp[1]+'" stroke="#2f7cff" stroke-width="6" stroke-linecap="round"/>';
    sv+='<circle cx="110" cy="110" r="7" fill="#1b1f3b"/>';
    sv+='<text id="ckDest" x="0" y="0" font-size="24" text-anchor="middle" dominant-baseline="central" opacity="0">'+leaveDest()+'</text>';
    sv+='</svg>';

    // the leaving-time hands start on top of the real hands and travel clockwise to the leaving time

    var exact=Math.max(0,(new Date(n.getFullYear(),n.getMonth(),n.getDate(),L.h,L.m)-n)/60000);
    var m1=m0+exact*6,h1=h0+exact*0.5;

    var showW=cfg.leave.showWedge!==false&&exact<=60;
    // slow and steady so kids can follow the minute hand (about 6–7 seconds for half an hour on "Slow")
    var sp=cfg.leave.sweep||'slow';
    var dur=sp==='fast'?Math.min(4200,1600+exact*35):sp==='medium'?Math.min(7000,2500+exact*70):Math.min(10000,3500+exact*120),t0=null;
    gm.setAttribute('opacity','.95');gh.setAttribute('opacity','.6');
    function ease(t){return -(Math.cos(Math.PI*t)-1)/2;} // gentle start and finish, steady in the middle

      if(run!==clockRun)return;
      if(t0==null)t0=ts;var t=Math.min(1,(ts-t0)/dur),e=ease(t);
      var ma=m0+(m1-m0)*e,ha=h0+(h1-h0)*e;

      if(t<1)requestAnimationFrame(frame);

  // Drag to reorder (works with fingers and a mouse). Items need data-id; dragging starts from the ⠿ handle.
  function reorderPeriod(per,ids){
    var slots=[],items=[];
    cfg.steps.forEach(function(s,i){if(stepPeriod(s)===per){slots.push(i);}});
    ids.forEach(function(id){var st=cfg.steps.filter(function(x){return x.id===id;})[0];if(st)items.push(st);});
    if(items.length!==slots.length)return;

  function makeSortable(container,itemSel,onDone){
    var drag=null;
    function items(){return [].slice.call(container.querySelectorAll(itemSel));}
    container.addEventListener('pointerdown',function(e){
      var h=e.target.closest('.grip');if(!h||!container.contains(h))return;
      var it=h.closest(itemSel);if(!it)return;
      e.preventDefault();e.stopPropagation();
      try{h.setPointerCapture(e.pointerId);}catch(_){}
      drag={it:it,h:h,id:e.pointerId,moved:false};it.classList.add('dragging');container.classList.add('sorting');
    });
    container.addEventListener('pointermove',function(e){
      if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
      var list=items(),y=e.clientY;
      for(var i=0;i<list.length;i++){
        var o=list[i];if(o===drag.it)continue;
        var r=o.getBoundingClientRect(),mid=r.top+r.height/2,dr=drag.it.getBoundingClientRect();
        if(y<mid&&dr.top>r.top){o.parentNode.insertBefore(drag.it,o);drag.moved=true;break;}
        if(y>mid&&dr.top<r.top){o.parentNode.insertBefore(drag.it,o.nextSibling);drag.moved=true;break;}
      }
      // keep the list scrolling while dragging near the edges
      var sb=document.getElementById('sBody'),sr=sb.getBoundingClientRect();
      if(y<sr.top+60)sb.scrollTop-=12;else if(y>sr.bottom-60)sb.scrollTop+=12;
    });
    function end(e){
      if(!drag||(e&&e.pointerId!==drag.id))return;
      drag.it.classList.remove('dragging');container.classList.remove('sorting');
      var moved=drag.moved;drag=null;
      if(moved)onDone(items().map(function(x){return x.getAttribute('data-id');}));
    }
    container.addEventListener('pointerup',end);container.addEventListener('pointercancel',end);
    container.addEventListener('click',function(e){if(e.target.closest('.grip'))e.preventDefault();},true);
  }

    document.getElementById('uvTitle').textContent=msg.title;
    var pt=protectionTimes();
    document.getElementById('uvSub').textContent='UV '+cat.name+' (peak '+Math.round(peak)+')'+(pt?' · sun protection '+fmtH(pt.from)+'–'+fmtH(pt.to):' · no sun protection times today');
    strip.innerHTML='';
    if(wxFresh()){
      var td=today(),nowH=new Date().getHours();
      for(var i=0;i<wx.hours.length;i++){
        if(wx.hours[i].slice(0,10)!==td)continue;
        var h=hourDate(wx.hours[i]).getHours();
        if(h<7||h>19)continue;
        var v=wx.uvh[i]||0;
        var c=el('div',{'class':'uvh'+(h===nowH?' now':'')});
        var b=el('div',{'class':'b'});b.style.background=uvCat(v).colour;b.title=fmtH(hourDate(wx.hours[i]))+': UV '+v.toFixed(1);
        c.appendChild(b);c.appendChild(el('div',{'class':'l'},(h%3===0)?String((h%12)||12):''));
        strip.appendChild(c);
      }
    }
  }
  document.getElementById('uv').addEventListener('click',function(){
    keepAwake();
    if(!wx||wx.date!==today()){say('Sorry, I can\'t check the sun right now.');return;}
    var pt=protectionTimes(),m=uvMessage(uvPeakAhead()).say;
    if(pt)m+=' Sun protection from '+fmtH(pt.from).replace('am',' a m').replace('pm',' p m')+' until '+fmtH(pt.to).replace('am',' a m').replace('pm',' p m')+'.';
    say(m);
  });

  function renderWx(){
    renderUV();
    var box=document.getElementById('wx');
    if(!wx||wx.date!==today()){
      box.classList.add('off');box.style.removeProperty('--wc');
      var offline=navigator.onLine===false||wxErr==='offline';
      document.getElementById('wxTitle').textContent=offline?'📶 No internet right now':wxErr?'Weather is taking a break':'Checking the weather…';
      document.getElementById('wxSub').textContent=offline?'The weather will show up again once this '+devWord()+' is back on wifi.':wxErr?'The weather service isn\'t answering. Medo will keep trying.':'';
      document.getElementById('wxWear').innerHTML='';
      document.getElementById('wxTemp').textContent='--°';
      return;
    }
    box.classList.remove('off');
    var o=outfit(wx);
    box.style.setProperty('--wc',o.band.colour);
    document.getElementById('wxIcon').textContent=wxIcon(wx.code);
    document.getElementById('wxTemp').textContent='';
    document.getElementById('wxTitle').textContent='What should I wear?';
    // small print for grown-ups only
    var pn=(wx.place||cfg.loc.name||'').split(',')[0];
    var sub=(pn?(wx.away?wx.awayEmoji+' ':'')+pn+' · ':'')+tmp(wx.min)+'→'+tmp(wx.max);
    sub+=rainSub();
    if(windWord(wx))sub+=' · gusts '+spd(wx.gust||wx.wind);
    var pk=uvPeakAhead();if(pk>=1)sub+=' · UV '+Math.round(pk);
    var pt=protectionTimes();if(pt)sub+=' ('+fmtH(pt.from)+'–'+fmtH(pt.to)+')';
    document.getElementById('wxSub').textContent=sub;
    var wr=document.getElementById('wxWear');wr.innerHTML='';
    o.wear.forEach(function(x){
      var d=el('div',{'class':'wear'});d.appendChild(iconEl(x[0],'e'));d.appendChild(el('div',{'class':'t'},x[1]));wr.appendChild(d);
    });
  }
  function feelWord(t){
    if(t>=35)return 'very hot';if(t>=28)return 'hot';if(t>=22)return 'warm';if(t>=17)return 'mild';
    if(t>=11)return 'cool';if(t>=6)return 'cold';return 'very cold';
  }
  function windWord(w){if((w.gust||0)>=60||(w.wind||0)>=40)return 'very windy';if((w.gust||0)>=40||(w.wind||0)>=25)return 'windy';return '';}
  var RAIN_PARTS=[['am',7,12,'before lunch'],['pm',12,18,'after lunch'],['eve',18,22,'tonight']];
  // the parts of today still to come, with their rain chance: [{w:'after lunch',p:90,mm:4,day:true}]
  function rainAhead(){
    if(!wx||!wx.rp||wx.date!==today())return null;
    var hr=new Date().getHours();
    return RAIN_PARTS.map(function(pt,i){var r=wx.rp[i]||{p:-1,mm:0};return {w:pt[3],p:r.p,mm:r.mm,day:pt[0]!=='eve',left:hr<pt[2]};}).filter(function(x){return x.left&&x.p>=0;});
  }
  function joinWords(a){return a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];}
  function rainReal(x){return x.day&&x.p>=40&&x.mm>=0.3;}    // enough to need a raincoat
  function rainDrops(x){return x.day&&x.p>=40&&x.mm<0.3;}
  // daytime rain in time order, e.g. "it will rain after lunch" (tonight is left out: it doesn't change what they wear)
  function rainClause(){
    var ra=rainAhead();
    if(!ra)return wx.rain>=70?'it will rain':wx.rain>=40?'it might rain':'';
    var real=ra.filter(rainReal),drops=ra.filter(rainDrops),day=ra.filter(function(x){return x.day;});
    if(real.length&&real.length===day.length&&day.length>1)return real.every(function(x){return x.p>=70;})?'it will rain all day':'it might rain all day';
    var bits=ra.filter(function(x){return rainReal(x)||rainDrops(x);}).map(function(x){
      return (rainReal(x)?(x.p>=70?'it will rain ':'it might rain '):'there might be a few drops of rain ')+x.w;});
    return joinWords(bits);
  }
  function rainSub(){   // for the card: "rain 90% after lunch"
    var ra=rainAhead();if(!ra)return wx.rain>=20?' · rain '+wx.rain+'%':'';
    var day=ra.filter(function(x){return x.day;}),wet=day.filter(function(x){return x.p>=20;});
    if(!wet.length)return '';
    var top=Math.max.apply(null,wet.map(function(x){return x.p;}));
    return ' · rain '+top+'%'+(wet.length===day.length&&day.length>1?'':' '+wet.map(function(x){return x.w;}).join(' & '));
  }
  // Kids act on it in order: what to put on, what to take, then why
  function weatherSpeech(){
    var o=outfit(wx),parts=[];
    var SPOKEN={'Dress or skirt':'a dress or skirt','Dress & tights':'a dress and tights','T-shirt':'a t-shirt','Jumper':'a jumper',
      'Warm jacket':'a warm jacket','Scarf':'a scarf','Pants or shorts':'pants or shorts'};
    function sp(x){return SPOKEN[x[1]]||x[1].toLowerCase();}
    function has(n){return o.wear.some(function(x){return x[1]===n;});}
    var bot=o.wear.filter(function(x){return x[2]==='b';}).map(sp);
    var items=o.wear.filter(function(x){return x[2]!=='b'&&['Raincoat','Hat','Sunscreen'].indexOf(x[1])<0;}).map(sp);
    if(bot.length)items.unshift(bot.join(' or '));
    if(items.length)parts.push('Wear '+joinWords(items)+'.');
    var acts=[];
    if(has('Sunscreen'))acts.push('put on sunscreen');
    if(has('Hat'))acts.push('wear your hat');
    if(has('Raincoat'))acts.push('take your raincoat');
    if(acts.length){var a=joinWords(acts);parts.push(a.charAt(0).toUpperCase()+a.slice(1)+'.');}
    if(has('Sunscreen')&&uvPeakAhead()>=8)parts.push('Play in the shade at lunchtime.');
    var wnd=windWord(wx),rc=rainClause();
    parts.push((wx.away&&wx.place?'In '+wx.place.split(',')[0]+', it':'It')+' will be '+feelWord(wx.max)+(wnd?' and '+wnd:'')+(rc?', and '+rc:'')+' today.');
    return parts.join(' ');
  }
  function wxFreshNow(){return wx&&wx.date===today()&&Date.now()-(wx.at||0)<45*60000&&wxLocOK();}
  function speakWx(){
    keepAwake();
    if(wxFreshNow()){say(weatherSpeech());return;}
    // old or missing forecast (e.g. the tablet was on overnight): fetch first, then speak
    fetchWx().then(function(ok){
      if(ok||(wx&&wx.date===today()))say(weatherSpeech());
      else say(navigator.onLine===false?'I need the internet to check the weather. Ask a grown-up to check the wifi.':'The weather is taking a break right now. Try again soon!');
    });
  }
  document.getElementById('wx').addEventListener('click',speakWx);
  window.addEventListener('offline',function(){if(!wx||wx.date!==today())renderWx();});
  var wxErr='';
  var wxBusy=null;
  function fetchWx(){ // returns a promise: true when fresh weather arrived
    if(wxBusy)return wxBusy;
    var L=wxLoc();
    var url='https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon+
      '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,weather_code,wind_speed_10m_max,wind_gusts_10m_max'+
      '&hourly=uv_index,weather_code,precipitation_probability,precipitation&timezone=auto&forecast_days=2';
    wxBusy=new Promise(function(done){
    try{
      fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
        var d=j.daily;
        wx={date:today(),now:j.current.temperature_2m,code:d.weather_code[0],max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],
            rain:d.precipitation_probability_max[0]||0,uv:d.uv_index_max[0]||0,at:Date.now(),lk:locKey(L),
            place:L.name,away:L.away,awayEmoji:L.emoji||'',
            wind:(d.wind_speed_10m_max&&d.wind_speed_10m_max[0])||0,gust:(d.wind_gusts_10m_max&&d.wind_gusts_10m_max[0])||0,
            hours:(j.hourly&&j.hourly.time)||[],uvh:(j.hourly&&j.hourly.uv_index)||[]};
        // Daily weather_code is the WORST weather of the whole day (one passing shower = rain cloud),
        // so pick the icon and rain chance from the daytime hours (7am–6pm) instead.
        var h=j.hourly||{},td=today(),cnt={sun:0,part:0,cloud:0,rain:0,storm:0,snow:0},dayRain=-1;
        (h.time||[]).forEach(function(t,i){
          if(t.slice(0,10)!==td)return;var hr=+t.slice(11,13);if(hr<7||hr>18)return;
          var c=(h.weather_code||[])[i],pp=(h.precipitation_probability||[])[i];
          if(pp!=null)dayRain=Math.max(dayRain,pp);
          if(c==null)return;
          if(c===0)cnt.sun++;else if(c<=2)cnt.part++;else if(c===3||c===45||c===48)cnt.cloud++;
          else if(c>=95)cnt.storm++;else if((c>=71&&c<=77)||c===85||c===86)cnt.snow++;else cnt.rain++;
        });
        var tot=cnt.sun+cnt.part+cnt.cloud+cnt.rain+cnt.storm+cnt.snow;
        if(tot){
          if(cnt.storm>=2)wx.code=95;
          else if(cnt.snow>=2)wx.code=71;
          else if(cnt.rain>=5)wx.code=61;          // rainy day
          else if(cnt.rain>=2)wx.code=80;          // some showers
          else wx.code=cnt.sun>=cnt.part&&cnt.sun>=cnt.cloud?0:(cnt.part>=cnt.cloud?2:3);
        }
        if(dayRain>=0)wx.rain=dayRain;
        // rain by part of the day: before lunch, after lunch, tonight
        wx.rp=RAIN_PARTS.map(function(pt){var o={p:-1,mm:0};
          (h.time||[]).forEach(function(t,i){if(t.slice(0,10)!==td)return;var hr=+t.slice(11,13);if(hr<pt[1]||hr>=pt[2])return;
            var pp=(h.precipitation_probability||[])[i],mm=(h.precipitation||[])[i];if(pp!=null)o.p=Math.max(o.p,pp);if(mm!=null)o.mm+=mm;});
          return o;});
        wxErr='';save('qb_wx',wx);render();renderWx();done(true);
      }).catch(function(){wxErr=navigator.onLine===false?'offline':'down';renderWx();done(false);});
    }catch(e){wxErr='down';renderWx();done(false);}
    });
    wxBusy.then(function(){wxBusy=null;});
    return wxBusy;
  }
  // Keep the forecast fresh even when the tablet is left on for days (timers can pause while the screen sleeps)
  function wxCheck(){if(!wxFreshNow())fetchWx();}
  setInterval(wxCheck,60000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wxCheck();});
  window.addEventListener('focus',wxCheck);
  window.addEventListener('online',function(){fetchWx();});


  // ================= Intro: a short animated hello after the system splash (tap to skip) =================
  var introDone=false,introWaiters=[];
  function afterIntro(fn){if(introDone)fn();else introWaiters.push(fn);}
  function endIntro(){
    if(introDone)return;introDone=true;var o=document.getElementById('intro');
    o.classList.add('out');setTimeout(function(){o.remove();},460);
    introWaiters.forEach(function(f){f();});introWaiters=[];
  }
  (function intro(){
    var o=document.getElementById('intro');if(!o)return;
    var quiet=false;try{quiet=sessionStorage.getItem('qb_quietReload')==='1';sessionStorage.removeItem('qb_quietReload');}catch(e){}
    if(quiet){introDone=true;o.remove();return;}
    var lg=document.getElementById('brand').querySelector('svg').cloneNode(true);lg.setAttribute('class','in-logo');o.appendChild(lg);
    ['⭐','✨','🌟','💫','⭐','✨','🌟','💫'].forEach(function(ch,i){
      var a=i/8*Math.PI*2,sp=el('span',{'class':'in-spark'},ch);
      sp.style.setProperty('--dx',Math.round(Math.cos(a)*190)+'px');sp.style.setProperty('--dy',Math.round(Math.sin(a)*150)+'px');sp.style.setProperty('--r',(i%2?40:-40)+'deg');
      sp.style.animationDelay=(0.55+i*0.03)+'s';o.appendChild(sp);
    });
    var kids=el('div',{'class':'in-kids'});
    cfg.kids.slice(0,6).forEach(function(kd,i){var k=el('span',{'class':'in-kid'},kd.emoji);k.style.animationDelay=(0.8+i*0.14)+'s';kids.appendChild(k);});
    o.appendChild(kids);
    var h=new Date().getHours(),part=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
    var names=cfg.kids.map(function(x){return x.name;}),who=names.length>3?'everyone':names.length>1?names.slice(0,-1).join(', ')+' & '+names[names.length-1]:(names[0]||'');
    var bk=-1;try{bk=birthdayKid(currentTheme());}catch(e){}
    var hi=el('div',{'class':'in-hi'},bk>-1?'🎂 Happy birthday, '+cfg.kids[bk].name+'!':part+', '+who+'!');
    hi.style.animationDelay=(0.85+cfg.kids.length*0.14)+'s';o.appendChild(hi);
    o.addEventListener('click',endIntro);
    setTimeout(endIntro,1500+cfg.kids.length*140+400);
  })();
  render();
  renderWx();
  fetchWx();
  setTimeout(statsStart,3000);
  if(firstRun&&!cfg.setupDone)afterIntro(function(){setTimeout(openSetup,250);});
  // Offline support + install as an app
  var swReg=null;
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){swReg=r;}).catch(function(){});}catch(e){}
  document.getElementById('updBar').addEventListener('click',applyUpdate);
  var installEvt=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;});
  window.addEventListener('appinstalled',function(){installEvt=null;});
  function isInstalled(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}catch(e){return false;}}
  fetchHolidays();setInterval(fetchHolidays,6*3600000);
})();
</script>
